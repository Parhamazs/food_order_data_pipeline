events {
    worker_connections 1024;
}

http {
# FastAPI (Upstream)
    upstream fastapi_ingestion {
        # روش توزیع بار: Round Robin (پیش‌فرض)
        server ingestion_api_1:8000;
        server ingestion_api_2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_ingestion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
